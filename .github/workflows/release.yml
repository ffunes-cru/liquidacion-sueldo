name: Release & Hot-Update Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 with Qt6 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION_STR="${{ github.ref_name }}"
          cmake --build build

      - name: Deploy Qt Dependencies (windeployqt)
        shell: msys2 {0}
        run: |
          mkdir -p dist/LiquidacionSueldos
          cp build/liquidacion_sueldos_app.exe dist/LiquidacionSueldos/
          cp LICENSE dist/LiquidacionSueldos/
          windeployqt-qt6 --qmldir qml dist/LiquidacionSueldos/liquidacion_sueldos_app.exe

      - name: Create Windows ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LiquidacionSueldos/*" -DestinationPath "LiquidacionSueldos-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: LiquidacionSueldos-Windows-x64.zip

  build-linux:
    name: Build Linux x86_64 Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6 and System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-declarative-private-dev \
            qt6-tools-dev \
            libqt6sql6-sqlite \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION_STR="${{ github.ref_name }}"

      - name: Build Application
        run: cmake --build build --config Release

      - name: Prepare Linux Portable Distribution
        run: |
          mkdir -p dist/LiquidacionSueldos
          cp build/liquidacion_sueldos_app dist/LiquidacionSueldos/
          cp LICENSE dist/LiquidacionSueldos/
          tar -czvf LiquidacionSueldos-Linux-x86_64.tar.gz -C dist/LiquidacionSueldos .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: LiquidacionSueldos-Linux-x86_64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_assets
          sha256sum LiquidacionSueldos-Windows-x64.zip LiquidacionSueldos-Linux-x86_64.tar.gz > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/LiquidacionSueldos-Windows-x64.zip
            release_assets/LiquidacionSueldos-Linux-x86_64.tar.gz
            release_assets/checksums.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
